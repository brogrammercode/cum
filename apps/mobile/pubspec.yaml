name: cruz
description: Cruz gaming presence and chat app
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dio: ^5.9.2
  flutter_bloc: ^9.1.1
  flutter_dotenv: ^6.0.1
  flutter_secure_storage: ^10.2.0
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  go_router: ^14.0.0
  google_fonts: ^6.2.1
  google_sign_in: ^6.2.1
  flutter_screenutil: ^5.9.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/
    - .env.example

flutter_launcher_icons:
  android: launcher_icon
  ios: true
  remove_alpha_ios: true
  image_path: assets/logo.png
